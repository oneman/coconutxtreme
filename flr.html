<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoconutXtreme: Frontline Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* the canvas is 960x1152: the HUD is drawn at 4x and the world at 5x, then scaled with hard pixel edges */
  canvas { display: block; outline: none; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c" width="960" height="1152" tabindex="0" aria-label="CoconutXtreme: Frontline Rush. Drive up the screen with W A S D or the arrow keys, press Space to bail out of a vehicle. Race to the frontline and dodge the drones."></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- setup
// World coordinates: x runs forward (toward the frontline), y runs across the road (0..LAT).
// On screen, forward is up. SW x SH is the HUD's coordinate space (the canvas is RES times that).
// The world is drawn zoomed in 1.25x on top of it (5 canvas pixels per world pixel), so the view
// shows VW x VH world pixels; the camera follows the player forward (camX) and sideways (camY).
const SW = 240, SH = 288, RES = 4, ZOOM = 1.25, VW = SW / ZOOM, VH = Math.ceil(SH / ZOOM), LAT = 300, HUD = 12, CW = 128, RH = 52;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const FONT = '"Press Start 2P", monospace';

function fit() {
  const s = Math.min(innerWidth / SW, innerHeight / SH);
  const k = s >= 3 ? Math.floor(s) : s;
  cvs.style.width = Math.floor(SW * k) + 'px';
  cvs.style.height = Math.floor(SH * k) + 'px';
}
addEventListener('resize', fit); fit();

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------------------------------------------------------------- pixel art (all drawn in code)
const K = {
  o: '#16181d', ol: '#5f6d30', old: '#414b20', oll: '#83923f', hel: '#505b28', sk: '#d39b62',
  ru: '#8f4c27', rud: '#5e301a', rul: '#bb6c3b', gm: '#6f747b', gd: '#45494f', gl: '#aab0b6',
  ch: '#2d2824', chd: '#1d1a17', chm: '#3d3630', wh: '#eeeadb', boot: '#2a2a20'
};
function spr(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw((x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); }, g);
  return c;
}
function bikeSpr(n) {
  return spr(20, 11, p => {
    p(0, 4, 5, 3, K.o); p(1, 5, 3, 1, K.gd);
    p(15, 4, 5, 3, K.o); p(16, 5, 3, 1, K.gd);
    p(4, 4, 11, 3, K.rud); p(7, 4, 5, 3, K.ru); p(8, 4, 2, 1, K.rul);
    p(3, 4, 4, 3, K.o); p(14, 4, 1, 3, K.gm);
    p(13, 1, 1, 9, K.o); p(13, 0, 1, 2, K.gd); p(13, 9, 1, 2, K.gd);
    if (n >= 2) { p(2, 2, 4, 7, K.old); p(3, 2, 2, 7, K.ol); p(2, 4, 4, 3, K.hel); p(3, 3, 2, 5, K.hel); p(3, 4, 1, 1, K.oll); }
    if (n >= 1) {
      p(6, 2, 5, 7, K.old); p(7, 2, 3, 7, K.ol); p(10, 2, 3, 2, K.ol); p(10, 7, 3, 2, K.ol);
      p(12, 2, 1, 2, K.sk); p(12, 7, 1, 2, K.sk);
      p(6, 4, 5, 3, K.hel); p(7, 3, 3, 5, K.hel); p(8, 4, 1, 1, K.oll); p(7, 2, 1, 1, K.wh);
    }
  });
}
function vanSpr() {
  return spr(36, 20, p => {
    p(5, 0, 6, 2, K.o); p(25, 0, 6, 2, K.o); p(5, 18, 6, 2, K.o); p(25, 18, 6, 2, K.o);
    p(1, 1, 34, 18, K.o);
    p(2, 2, 32, 16, '#7b8848'); p(2, 15, 32, 3, '#5d6935'); p(2, 2, 32, 1, '#98a65d');
    p(4, 7, 4, 3, '#4b5527'); p(16, 12, 5, 2, '#4b5527'); p(11, 3, 3, 2, '#4b5527'); p(19, 5, 3, 3, '#4b5527');
    p(6, 5, 16, 1, '#34391e'); p(6, 13, 16, 1, '#34391e'); p(8, 5, 1, 9, '#34391e'); p(14, 5, 1, 9, '#34391e'); p(20, 5, 1, 9, '#34391e');
    p(23, 3, 5, 14, '#1f2b35'); p(24, 4, 1, 5, '#6d8da3'); p(25, 4, 1, 2, '#6d8da3');
    p(28, 3, 6, 14, '#6c793f'); p(30, 4, 1, 12, '#5d6935');
    p(34, 3, 1, 2, '#f3e7a0'); p(34, 15, 1, 2, '#f3e7a0');
    p(24, 0, 2, 1, K.o); p(24, 19, 2, 1, K.o);
    p(10, 8, 2, 1, K.wh); p(12, 9, 2, 2, K.wh); p(10, 11, 2, 1, K.wh);
    p(1, 4, 1, 12, '#3b4220');
  });
}
function footSpr(f) {
  return spr(10, 9, p => {
    if (f === 0) { p(6, 1, 2, 2, K.boot); p(0, 5, 3, 2, K.boot); }
    else { p(0, 1, 3, 2, K.boot); p(6, 5, 2, 2, K.boot); }
    p(2, 1, 5, 7, K.o); p(3, 1, 3, 7, K.old); p(3, 2, 3, 5, K.ol);
    p(6, 6, 4, 1, K.o);
    p(2, 3, 5, 3, K.hel); p(3, 2, 3, 5, K.hel); p(4, 3, 1, 1, K.oll); p(3, 1, 1, 1, K.wh);
  });
}
function tankSpr() {
  return spr(32, 22, p => {
    p(2, 4, 28, 3, K.chd);
    p(1, 6, 30, 8, K.ch); p(1, 6, 30, 1, K.chm);
    p(28, 7, 3, 7, K.chm);
    p(0, 14, 32, 6, K.chd);
    for (let i = 0; i < 6; i++) { p(2 + i * 5, 15, 3, 4, K.ch); p(3 + i * 5, 16, 1, 2, K.ru); }
    p(0, 13, 32, 1, K.chm);
    p(4, 8, 5, 3, K.rud); p(20, 10, 4, 3, K.ru); p(24, 7, 3, 2, K.rud); p(10, 12, 3, 1, K.ru);
    p(9, 3, 13, 9, K.o); p(10, 4, 11, 7, K.chm); p(11, 5, 9, 5, K.ch); p(13, 5, 4, 3, K.chd); p(12, 4, 2, 1, K.gd);
    p(16, 8, 3, 2, K.rud);
    p(2, 9, 8, 2, K.o); p(2, 9, 7, 1, K.chm);
    p(6, 7, 1, 1, '#4a4038'); p(26, 11, 1, 1, '#4a4038');
  });
}
function rotL(src) { return spr(src.height, src.width, (p, g) => { g.translate(0, src.width); g.rotate(-Math.PI / 2); g.drawImage(src, 0, 0); }); }
function flipX(src) { return spr(src.width, src.height, (p, g) => { g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); }); }
function charred(src, seed) {
  return spr(src.width, src.height, (p, g) => {
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(28,22,18,0.74)'; g.fillRect(0, 0, src.width, src.height);
    for (let i = 0; i < src.width * src.height / 9; i++) {
      const x = (hash(i, 1, seed) * src.width) | 0, y = (hash(i, 2, seed) * src.height) | 0;
      g.fillStyle = hash(i, 3, seed) < 0.5 ? K.rud : '#121010'; g.fillRect(x, y, 1, 1);
    }
  });
}
function trashSpr() {
  return spr(14, 9, p => {
    p(1, 3, 5, 5, '#7e8574'); p(2, 3, 3, 1, '#9aa190');
    p(5, 1, 5, 5, '#6b5640'); p(5, 1, 5, 1, '#8a7152'); p(7, 1, 1, 5, '#4f3f2e');
    p(9, 4, 5, 4, K.o); p(10, 5, 3, 2, K.gd); p(11, 5, 1, 2, K.o);
    p(3, 7, 2, 1, '#c9c2a4'); p(12, 2, 1, 1, '#c94a3a'); p(0, 6, 1, 1, '#d8d0b0');
  });
}
function barrelSpr() {
  return spr(12, 11, p => {
    p(1, 2, 5, 8, K.ru); p(1, 2, 5, 2, K.rul); p(2, 3, 3, 1, K.rud); p(1, 6, 5, 1, K.rud);
    p(6, 1, 5, 8, '#3e5a3a'); p(6, 1, 5, 2, '#5d7d55'); p(7, 2, 3, 1, '#2d4229'); p(6, 5, 5, 1, '#2d4229');
  });
}
function blobSpr(w, h, seed, fn) {
  return spr(w, h, p => {
    const cx = (w - 1) / 2, cy = (h - 1) / 2, rx = w / 2 - 1, ry = h / 2 - 1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const e = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + (hash(x, y, seed) - 0.5) * 0.3;
      const c = fn(e, x - cx, y - cy);
      if (c) p(x, y, 1, 1, c);
    }
  });
}
const puddleSpr = (w, h, s) => blobSpr(w, h, s, (e, dx, dy) =>
  e < 0.72 ? ((dy < -1 && dy > -3 && Math.abs(dx) < w / 4 && hash(dx, dy, s) < 0.6) ? '#9cc6dc' : '#43708c')
  : e < 0.95 ? '#2e4b5f' : e < 1.15 ? '#5c4630' : null);
const craterSpr = (w, h, s) => blobSpr(w, h, s, (e) =>
  e < 0.45 ? '#3a5a6a' : e < 0.8 ? '#45321f' : e < 1.05 ? '#8f7050' : e < 1.2 ? '#6e5236' : null);
function treeSpr(s, seed) {
  const w = s + 2, h = s + 6;
  return spr(w, h, p => {
    p((w >> 1) - 1, s - 2, 2, 7, '#4a3320');
    const cx = w / 2 - 0.5, cy = s / 2, r = s / 2;
    for (let y = 0; y < s + 1; y++) for (let x = 0; x < w; x++) {
      const dx = x - cx, dy = y - cy, e = (dx * dx + dy * dy) / (r * r) + (hash(x, y, seed) - 0.5) * 0.35;
      if (e > 1) continue;
      let c = '#44692a';
      if (e > 0.82) c = '#1f3315';
      else if (dx + dy < -r * 0.45) c = '#6f9a3c';
      else if (dx + dy > r * 0.45) c = '#2e4a1f';
      else if (hash(x >> 1, y >> 1, seed + 7) < 0.25) c = '#56803a';
      p(x, y, 1, 1, c);
    }
  });
}
function poleSpr() {
  return spr(9, 19, p => {
    p(4, 1, 1, 18, '#5a3d22'); p(4, 1, 1, 18, '#5a3d22'); p(3, 17, 3, 2, '#3b2816');
    p(1, 3, 7, 1, '#4a321c'); p(1, 2, 1, 1, '#d5dccf'); p(7, 2, 1, 1, '#d5dccf'); p(4, 0, 1, 1, '#d5dccf');
  });
}
function droneSpr(f) {
  return spr(11, 11, p => {
    for (let i = 1; i < 10; i++) { p(i, i, 1, 1, K.o); p(10 - i, i, 1, 1, K.o); }
    p(4, 4, 3, 3, '#3a3e44'); p(4, 4, 3, 1, '#5e636a'); p(4, 7, 3, 2, '#6b5a3a'); p(5, 9, 1, 1, '#c9a54a');
    const r = 'rgba(205,210,215,0.75)';
    for (const [x, y] of [[0, 0], [8, 0], [0, 8], [8, 8]]) {
      if (f === 0) { p(x, y + 1, 3, 1, r); p(x + 1, y, 1, 3, r); }
      else { p(x, y, 1, 1, r); p(x + 2, y + 2, 1, 1, r); p(x + 2, y, 1, 1, r); p(x, y + 2, 1, 1, r); }
    }
  });
}
function coconutSpr() {
  return spr(9, 9, p => {
    p(2, 0, 5, 9, '#6b3f1f'); p(0, 2, 9, 5, '#6b3f1f'); p(1, 1, 7, 7, '#6b3f1f');
    p(2, 1, 3, 1, '#9a6234'); p(1, 2, 1, 2, '#9a6234');
    p(3, 3, 1, 1, '#2a160a'); p(5, 3, 1, 1, '#2a160a'); p(4, 5, 1, 1, '#2a160a');
  });
}
function flagSpr() {
  const coco = coconutSpr();
  return spr(22, 28, (p, g) => {
    p(1, 0, 2, 28, '#5a3d22'); p(1, 0, 1, 28, '#7a5732');
    p(3, 1, 18, 12, '#2f7a3a'); p(3, 1, 18, 1, '#4ea25a'); p(3, 12, 18, 1, '#225a2a');
    g.drawImage(coco, 8, 3);
  });
}
const sandbagSpr = spr(8, 5, p => { p(0, 1, 8, 4, '#a08d5e'); p(0, 1, 8, 1, '#bba873'); p(3, 1, 1, 4, '#7e6d45'); p(0, 4, 8, 1, '#7e6d45'); });

const SPR = {
  bike: [bikeSpr(0), bikeSpr(1), bikeSpr(2)],
  van: vanSpr(),
  foot: [footSpr(0), footSpr(1)],
  tank: tankSpr(), drone: [droneSpr(0), droneSpr(1)],
  trash: trashSpr(), barrels: barrelSpr(), pole: poleSpr(), coconut: coconutSpr(), flag: flagSpr(),
  puddles: [puddleSpr(24, 10, 3), puddleSpr(18, 8, 5), puddleSpr(30, 12, 9)],
  craters: [craterSpr(22, 12, 11), craterSpr(18, 10, 13)],
  trees: [treeSpr(12, 21), treeSpr(14, 23), treeSpr(17, 25), treeSpr(13, 27)],
};
SPR.tankW = flipX(SPR.tank);
SPR.bikeWreck = charred(bikeSpr(0), 31);
SPR.vanWreck = charred(SPR.van, 37);
const shadowCache = new Map();
function shadow(w, h) {
  const key = w + 'x' + h;
  if (!shadowCache.has(key)) shadowCache.set(key, blobSpr(w, h, 1, e => e < 0.9 ? 'rgba(12,16,8,0.32)' : null));
  return shadowCache.get(key);
}

// ---------------------------------------------------------------- map
const THEMES = [
  { name: 'WHEAT BELT', fields: ['wheat', 'wheat', 'wheat', 'plow', 'grass'], belts: 0.45, ew: 0.25, poles2: false, puddle: 1 },
  { name: 'TREE LINE ROAD', fields: ['grass', 'wheat', 'plow', 'grass'], belts: 0.85, ew: 0.6, poles2: false, puddle: 1 },
  { name: 'POWER LINE FLATS', fields: ['plow', 'wheat', 'mud', 'plow'], belts: 0.25, ew: 0.15, poles2: true, puddle: 1.8 },
];
const PW = 230;
let M = null;
function roadY(x) { return LAT / 2 + 24 * Math.sin(x * 0.0037 + M.s1) + 8 * Math.sin(x * 0.0101 + M.s2); }
const parcel = x => Math.floor((x + 5000) / PW);

function newMap(n) {
  const theme = THEMES[(n - 1) % THEMES.length];
  const seed = (Math.random() * 1e9) | 0, rng = mulberry(seed);
  M = { n, theme, seed, rng, s1: rng() * 6.28, s2: rng() * 6.28, chunks: new Map(), decals: [], obs: [], poles: [[], []], front: 2500, gauntEnd: 640 };
  genWorld();
}

function lowerBound(arr, x) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].x < x) lo = m + 1; else hi = m; } return lo; }
function addObs(o) { M.obs.splice(lowerBound(M.obs, o.x), 0, o); return o; }
function forNear(x0, x1, fn) { const a = M.obs; for (let i = lowerBound(a, x0 - 20); i < a.length && a[i].x <= x1 + 20; i++) fn(a[i]); }

const OBJ = {
  tank: { hw: 13, hh: 6, solid: true, ax: 16, ay: 12, sh: [32, 12] },
  tankW: { hw: 13, hh: 6, solid: true, ax: 16, ay: 12, sh: [32, 12] },
  bikewreck: { hw: 7, hh: 3, solid: true, ax: 10, ay: 5, sh: [20, 7] },
  vanwreck: { hw: 15, hh: 7, solid: true, ax: 18, ay: 10, sh: [36, 16] },
  trash: { hw: 5, hh: 3, fx: 'trash', ax: 7, ay: 5, sh: [14, 5] },
  barrels: { hw: 5, hh: 2, solid: true, ax: 6, ay: 8, sh: [12, 5] },
  pole: { hw: 1, hh: 1, solid: true, ax: 4, ay: 18 },
  tree: { hw: 2, hh: 2, solid: true },
  puddle: { fx: 'puddle', flat: true },
  crater: { fx: 'puddle', flat: true },
  sandbag: { deco: true, ax: 4, ay: 3 },
  flag: { deco: true, ax: 2, ay: 27 },
};
// things lying on the road are drawn turned so they point along it
const ROT = {}; for (const k of ['tank', 'tankW', 'bikewreck', 'vanwreck', 'trash', 'puddle', 'crater']) ROT[k] = new Map();
function place(kind, x, y, extra) {
  const d = OBJ[kind], o = Object.assign({ kind, x, y, hw: d.hw || 0, hh: d.hh || 0, solid: !!d.solid, fx: d.fx || null, flat: !!d.flat, deco: !!d.deco, ax: d.ax, ay: d.ay, sh: d.sh }, extra);
  if (kind === 'puddle' || kind === 'crater') {
    const list = kind === 'puddle' ? SPR.puddles : SPR.craters;
    o.img = list[(M.rng() * list.length) | 0];
    o.hw = o.img.width / 2 - 3; o.hh = o.img.height / 2 - 2; o.ax = o.img.width / 2; o.ay = o.img.height / 2;
  } else if (kind === 'tree') {
    o.img = SPR.trees[(M.rng() * SPR.trees.length) | 0];
    o.ax = o.img.width / 2; o.ay = o.img.height - 2; o.sh = [o.img.width + 2, 6];
  } else o.img = { tank: SPR.tank, tankW: SPR.tankW, bikewreck: SPR.bikeWreck, vanwreck: SPR.vanWreck, trash: SPR.trash, barrels: SPR.barrels, pole: SPR.pole, sandbag: sandbagSpr, flag: SPR.flag }[kind];
  if (ROT[kind]) {
    o.img = ROT[kind].get(o.img) || ROT[kind].set(o.img, rotL(o.img)).get(o.img);
    o.ax = o.img.width / 2; o.ay = o.img.height / 2;
    if (o.sh) o.sh = [o.sh[1], o.sh[0]];
  }
  return addObs(o);
}
function pick(rng, list) { let t = 0; for (const [, w] of list) t += w; let r = rng() * t; for (const [k, w] of list) { if ((r -= w) <= 0) return k; } return list[0][0]; }

function genWorld() {
  const rng = M.rng, th = M.theme;
  // the gauntlet: the first few seconds on the road are packed with junk
  let x = 260;
  while (x < M.gauntEnd) {
    const ry = roadY(x);
    const k = pick(rng, [['tank', 3], ['bikewreck', 2.2], ['trash', 2], ['puddle', 2 * th.puddle], ['barrels', 1], ['vanwreck', 0.7]]);
    const o1 = (rng() * 2 - 1) * (RH - 5);
    const kk = k === 'tank' && rng() < 0.5 ? 'tankW' : k;
    const a = place(kk, x, ry + o1, { smoke: (k === 'tank' || k === 'vanwreck') && rng() < 0.4 });
    if (rng() < 0.3) {
      const side = o1 > 0 ? -1 : 1;
      const k2 = pick(rng, [['trash', 2], ['puddle', 2], ['bikewreck', 1.5], ['barrels', 1]]);
      const o2 = side * (6 + rng() * (RH - 10));
      if (Math.abs(o2 - o1) > a.hh + 18) place(k2, x + rnd(-8, 8), ry + o2);
    }
    if (rng() < 0.12) place(rng() < 0.5 ? 'tank' : 'bikewreck', x + rnd(-20, 20), ry + (rng() < 0.5 ? -1 : 1) * (RH + 12 + rng() * 16), { smoke: rng() < 0.3 });
    x += 95 + rng() * 60 - Math.min(15, M.n * 4);
  }
  // the open stretch: a few craters and puddles, mostly room for the drones to work
  x = M.gauntEnd + 90;
  while (x < M.front - 90) {
    const ry = roadY(x);
    const k = pick(rng, [['puddle', 2 * th.puddle], ['crater', 3], ['trash', 1], ['tank', 0.8]]);
    const off = k === 'tank' ? (rng() < 0.5 ? -1 : 1) * (RH + 10) : (rng() * 2 - 1) * (RH - 4);
    place(k, x, ry + off, { smoke: k === 'tank' && rng() < 0.5 });
    x += 230 + rng() * 200;
  }
  for (let i = 0; i < 90; i++) {
    const hx = M.gauntEnd + rng() * (M.front - M.gauntEnd);
    M.decals.push({ type: 'hole', x: hx, y: 4 + rng() * (LAT - 8), r: 2 + rng() * 3 });
  }
  // power lines along the road
  for (let px = -320, i = 0; px < M.front + 420; px += 78, i++) {
    if (rng() < 0.07) continue;
    const pn = place('pole', px, roadY(px) - RH - 8);
    M.poles[0].push(pn);
    if (th.poles2) { const qx = px + 39; const ps = place('pole', qx, roadY(qx) + RH + 9); M.poles[1].push(ps); }
  }
  // tree lines along field borders and parallel to the road
  for (let pi = parcel(-320); pi <= parcel(M.front + 400); pi++) {
    const bx = pi * PW - 5000;
    if (hash(pi, 1, M.seed) < th.belts) {
      const ry = roadY(bx);
      for (let y = 4 + rng() * 4; y < ry - RH - 14; y += 7 + rng() * 3) place('tree', bx + rnd(-2, 2), y);

// ---------------------------------------------------------------- terrain chunks

  plow: [C('#5c4028'), C('#765232'), C('#765232'), C('#684a2e')], sprout: C('#60783a'),

  }

  for (let i = 0; i < 8; i++) part(x, y, { vx: rnd(-60, 60), vy: rnd(-40, 40), vz: rnd(40, 90), life: rnd(0.5, 0.9), size: 1, col: '#1a1714', drag: 1, grav: 160 });

// ---------------------------------------------------------------- kills and damage
function kill(u, cause) {

  if (u.kind !== 'foot') {
    const k = u.kind === 'van' ? 'vanwreck' : 'bikewreck';
    place(k, u.x, u.y, { smoke: true });
    addDecal({ type: 'scorch', x: u.x, y: u.y, r: u.kind === 'van' ? 10 : 7 });
  } else addDecal({ type: 'scorch', x: u.x, y: u.y, r: 4 });
  if (n > 0) {
    const what = u.kind === 'foot' ? 'SOLDIER DOWN' : (u.kind === 'van' ? 'VAN HIT' : 'BIKE HIT') + (n > 1 ? ' - ' + n + ' LOST' : '');

}

// ---------------------------------------------------------------- bail out
function bail() {

  const out = [];
  for (let i = 0; i < u.crew; i++) {
    const side = i % 2 === 0 ? -1 : 1, off = (u.kind === 'van' ? 9 : 5) + (i >> 1) * 4;
    const f = makeUnit('foot', u.x - 3 - i * 3, clamp(u.y + side * off, 4, LAT - 4), 1);
    f.vx = u.vx * 0.55; f.vy = side * rnd(55, 80) + u.vy * 0.3; f.tumble = 0.5;
    units.push(f); out.push(f);
  }
  u.crew = 0; u.decoy = 1.8;
  ctl = out[0];
  for (const d of drones) if (d.state === 'hunt' && d.target === u && Math.random() > 0.65) d.target = chooseTarget(d);
  say(out.length > 1 ? 'BAIL OUT! x' + out.length : 'BAIL OUT!', '#f3d34a', 1);

// ---------------------------------------------------------------- drones
function chooseTarget(d) {

  if (!c.length) return null;
  let tot = 0; const w = c.map(u => { const k = (u === ctl ? 3 : 1) * (u.decoy > 0 && !soldiersIn(u) ? 1.6 : 1) / (1 + Math.hypot(u.x - d.x, u.y - d.y) / 150); tot += k; return k; });

  return c[0];
}
function spawnDrone() {
  const idx = run.droneIdx++, lvl = M.n - 1;
  const spd = Math.min(185, 40 + idx * 12 + lvl * 9);
  const turn = Math.min(5.5, 1.6 + idx * 0.3 + lvl * 0.2);
  const dive = Math.max(0.38, 0.82 - idx * 0.035 - lvl * 0.04);
  let x, y; const r = Math.random();

  else if (r < 0.45) { x = camX + rnd(VH * 0.5, VH); y = Math.random() < 0.5 ? camY - 10 : camY + VW + 10; }
  else { x = camX + VH + 16; y = camY + rnd(10, VW - 10); }

  if (d.target) d.h = Math.atan2(d.target.y - y, d.target.x - x);

    const t = d.target;
    if (t) {
      const dist = Math.hypot(t.x - d.x, t.y - d.y);
      const lead = clamp(dist / (d.spd + 60), 0, 0.8);

  text('SURVIVAL TIME', SW / 2, 140, '#a9aeb4', 'center');
  text('TOTAL', 30, 154, '#f3d34a'); text(W.score.toFixed(1) + 'S', 210, 154, '#f3d34a', 'right');
  text('AVERAGE', 30, 166, '#f3d34a'); text(W.avg.toFixed(1) + 'S', 210, 166, '#f3d34a', 'right');
  if (W.newBest) text('NEW BEST TOTAL!', SW / 2, 182, '#7ef08a', 'center');
  if (overT > 0.8 && ((clock * 2.5) | 0) % 2) text('SPACE  NEXT MAP', SW / 2, 200, '#ffffff', 'center');
}

// ---------------------------------------------------------------- input
const keys = new Set();
const KEYMAP = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
function action() {
  audioInit();
  if (state === 'title') startWave(1);
  else if (state === 'card') startRun();
  else if (state === 'play') { if (!paused) bail(); }
  else if (state === 'over' && overT > 0.8) startWave(W.n + 1);
}
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys.add(KEYMAP[e.code]); e.preventDefault(); audioInit(); }
  else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) action(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') { paused = !paused; if (paused) silence(); } }
  else if (e.code === 'KeyM') setMuted(!muted);
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys.delete(KEYMAP[e.code]); });
addEventListener('blur', () => { keys.clear(); if (state === 'play') { paused = true; silence(); } });
// touch: hold left or right of your soldier to steer, near the top or bottom to speed up or brake, tap to bail
let touch = null;
cvs.addEventListener('pointerdown', e => { cvs.focus(); touch = { id: e.pointerId, t: performance.now(), x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }; cvs.setPointerCapture(e.pointerId); audioInit(); });
cvs.addEventListener('pointermove', e => { if (touch && e.pointerId === touch.id) { touch.x = e.clientX; touch.y = e.clientY; touch.moved = touch.moved || Math.hypot(e.clientX - touch.x0, e.clientY - touch.y0) > 10; } });
const endTouch = e => {
  if (!touch || e.pointerId !== touch.id) return;
  if (!touch.moved && performance.now() - touch.t < 230) { if (paused) paused = false; else action(); }
  touch = null;
};
cvs.addEventListener('pointerup', endTouch); cvs.addEventListener('pointercancel', endTouch);
function readInput() {
  // input.x is forward (up the screen), input.y is across the road (right on screen)
  input.x = (keys.has('u') ? 1 : 0) - (keys.has('d') ? 1 : 0);
  input.y = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0);
  if (touch && ctl && performance.now() - touch.t > 120) {
    const r = cvs.getBoundingClientRect();
    const tx = (touch.x - r.left) / r.width * SW, ty = (touch.y - r.top) / r.height * SH;
    const wy = tx / ZOOM + camY; if (Math.abs(wy - ctl.y) > 3) input.y = Math.sign(wy - ctl.y);
    if (ty < SH * 0.25) input.x = 1; else if (ty > SH * 0.85) input.x = -1;
  }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  readInput();
  if (!paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
newMap(1);
camX = -100; camY = clamp(roadY(0) - VW / 2, 0, LAT - VW);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => { });
cvs.focus();
requestAnimationFrame(frame);

// small hook for automated play-testing
window.__flr = { get state() { return state; }, get W() { return W; }, get run() { return run; }, get units() { return units; }, get drones() { return drones; }, get ctl() { return ctl; }, get M() { return M; }, input, keys, action, roadY: x => roadY(x), forNear: (a, b, f) => forNear(a, b, f), update, setPaused: p => { paused = p; } };
})();
</script>
