<body>
<canvas id="c" width="1536" height="864" tabindex="0" aria-label="CoconutXtreme: Frontline Rush 3D. Drive forward with W A S D or the arrow keys, press Space to bail out of a vehicle, C to switch between third and first person. Race to the frontline and dodge the drones."></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- setup
// World coordinates are the same as the 2D game: x runs forward (toward the frontline),
// y runs across the road (0..LAT, increasing to the right), and z is height above the ground.
// Everything 3D is drawn by hand into a 384x216 pixel buffer (no WebGL): a mode-7 style
// ground pass, then z-buffered flat-shaded triangles, billboards, lines and particles.
const SW = 384, SH = 216, RES = 4, HUD = 12;
const LAT = 300, CW = 128, RH = 52;
// the 2D game's camera window, still used by the game logic (drone spawns, cleanup)
const VW = 192, VH = 231;
// the ground texture extends past the playable strip so the fields reach the horizon
const Y0 = -220, TW = 740;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const FONT = '"Press Start 2P", monospace';

function fit() {
  const s = Math.min(innerWidth / SW, innerHeight / SH);
  const k = s >= 3 ? Math.floor(s) : s;
  cvs.style.width = Math.floor(SW * k) + 'px';
  cvs.style.height = Math.floor(SH * k) + 'px';
}
addEventListener('resize', fit); fit();

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y, s) {

  return (h >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const C = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
const pack = (r, g, b) => 0xff000000 | (b << 16) | (g << 8) | r;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 6.2832; while (d < -Math.PI) d += 6.2832; return d; };

// ---------------------------------------------------------------- 2D pixel art (textures, drawn in code)
const K = {
  o: '#16181d', ol: '#5f6d30', old: '#414b20', oll: '#83923f', hel: '#505b28', sk: '#d39b62',
  ru: '#8f4c27', rud: '#5e301a', rul: '#bb6c3b', gm: '#6f747b', gd: '#45494f', gl: '#aab0b6',
  ch: '#2d2824', chd: '#1d1a17', chm: '#3d3630', wh: '#eeeadb', boot: '#2a2a20'
};
function spr(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw((x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); }, g);
  return c;
}
function rotL(src) { return spr(src.height, src.width, (p, g) => { g.translate(0, src.width); g.rotate(-Math.PI / 2); g.drawImage(src, 0, 0); }); }
function blobSpr(w, h, seed, fn) {
  return spr(w, h, p => {
    const cx = (w - 1) / 2, cy = (h - 1) / 2, rx = w / 2 - 1, ry = h / 2 - 1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const e = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + (hash(x, y, seed) - 0.5) * 0.3;
      const c = fn(e, x - cx, y - cy);
      if (c) p(x, y, 1, 1, c);
    }
  });
}
const puddleSpr = (w, h, s) => blobSpr(w, h, s, (e, dx, dy) =>
  e < 0.72 ? ((dy < -1 && dy > -3 && Math.abs(dx) < w / 4 && hash(dx, dy, s) < 0.6) ? '#9cc6dc' : '#43708c')
  : e < 0.95 ? '#2e4b5f' : e < 1.15 ? '#5c4630' : null);
const craterSpr = (w, h, s) => blobSpr(w, h, s, (e) =>
  e < 0.45 ? '#3a5a6a' : e < 0.8 ? '#45321f' : e < 1.05 ? '#8f7050' : e < 1.2 ? '#6e5236' : null);
// side-on trees for billboards: windbreak poplars and rounder field trees
function treeSide(w, h, seed, tall) {
  return spr(w, h, p => {
    const th = Math.round(h * (tall ? 0.18 : 0.28));
    p((w >> 1) - 1, h - th - 2, 2, th + 2, '#4a3320'); p((w >> 1) - 1, h - th - 2, 1, th + 2, '#5e432a');
    const ch = h - th, cx = (w - 1) / 2, cy = ch / 2, rx = w / 2, ry = ch / 2;
    for (let y = 0; y < ch; y++) for (let x = 0; x < w; x++) {
      const dx = x - cx, dy = y - cy, e = (dx / rx) ** 2 + (dy / ry) ** 2 + (hash(x, y, seed) - 0.5) * 0.4;
      if (e > 1) continue;
      let c = '#44692a';
      if (e > 0.8) c = '#2a4319';
      else if (dx / rx + dy / ry < -0.55) c = '#6f9a3c';
      else if (dx / rx + dy / ry > 0.5) c = '#2e4a1f';
      else if (hash(x >> 1, y >> 1, seed + 7) < 0.25) c = '#56803a';
      p(x, y, 1, 1, c);
    }
  });
}
function coconutSpr() {
  return spr(9, 9, p => {
    p(2, 0, 5, 9, '#6b3f1f'); p(0, 2, 9, 5, '#6b3f1f'); p(1, 1, 7, 7, '#6b3f1f');
    p(2, 1, 3, 1, '#9a6234'); p(1, 2, 1, 2, '#9a6234');
    p(3, 3, 1, 1, '#2a160a'); p(5, 3, 1, 1, '#2a160a'); p(4, 5, 1, 1, '#2a160a');
  });
}
function flagSpr() {
  const coco = coconutSpr();
  return spr(22, 28, (p, g) => {
    p(1, 0, 2, 28, '#5a3d22'); p(1, 0, 1, 28, '#7a5732');
    p(3, 1, 18, 12, '#2f7a3a'); p(3, 1, 18, 1, '#4ea25a'); p(3, 12, 18, 1, '#225a2a');
    g.drawImage(coco, 8, 3);

}
function tex(c) { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height); return { w: c.width, h: c.height, d: new Uint32Array(d.data.buffer) }; }

const SPR = {
  coconut: coconutSpr(),
  puddles: [puddleSpr(24, 10, 3), puddleSpr(18, 8, 5), puddleSpr(30, 12, 9)].map(rotL),
  craters: [craterSpr(22, 12, 11), craterSpr(18, 10, 13)].map(rotL),

const TEX = {
  trees: [treeSide(10, 30, 21, true), treeSide(16, 24, 23), treeSide(12, 28, 25, true), treeSide(18, 26, 27), treeSide(14, 22, 29)].map(tex),
  flag: tex(flagSpr()),
};

// ---------------------------------------------------------------- 3D models (boxes and prisms, flat shaded)
function mesh() { return { v: [], f: [] }; }
function face(m, ia, ib, ic, col, cen, ds) {
  const a = m.v[ia], b = m.v[ib], c = m.v[ic];
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz); if (l < 1e-9) return;
  nx /= l; ny /= l; nz /= l;
  if (cen) {
    const dx = (a[0] + b[0] + c[0]) / 3 - cen[0], dy = (a[1] + b[1] + c[1]) / 3 - cen[1], dz = (a[2] + b[2] + c[2]) / 3 - cen[2];
    if (nx * dx + ny * dy + nz * dz < 0) { const t = ib; ib = ic; ic = t; nx = -nx; ny = -ny; nz = -nz; }
  }
  m.f.push({ a: ia, b: ib, c: ic, nx, ny, nz, col: typeof col === 'string' ? C(col) : col, ds: !!ds });
}
function quadI(m, i0, i1, i2, i3, col, cen, ds) { face(m, i0, i1, i2, col, cen, ds); face(m, i0, i2, i3, col, cen, ds); }
function box(m, x0, x1, y0, y1, z0, z1, col, top) {
  const cen = [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], i = m.v.length;
  m.v.push([x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]);
  quadI(m, i + 4, i + 5, i + 6, i + 7, top || col, cen);
  if (z0 > 0.01) quadI(m, i, i + 1, i + 2, i + 3, col, cen);
  quadI(m, i + 1, i + 2, i + 6, i + 5, col, cen);
  quadI(m, i, i + 3, i + 7, i + 4, col, cen);
  quadI(m, i + 3, i + 2, i + 6, i + 7, col, cen);
  quadI(m, i, i + 1, i + 5, i + 4, col, cen);
}
// a prism: axis 'y' for wheels, 'z' for barrels
function cyl(m, axis, a, b, r, l0, l1, n, col, cap) {
  const P = (u, v, l) => axis === 'y' ? [a + u, l, b + v] : [a + u, b + v, l];
  const cen = P(0, 0, (l0 + l1) / 2), r0 = [], r1 = [];
  for (let k = 0; k < n; k++) {
    const t = (k + 0.5) / n * 6.2832, u = Math.cos(t) * r, v = Math.sin(t) * r;
    r0.push(m.v.push(P(u, v, l0)) - 1); r1.push(m.v.push(P(u, v, l1)) - 1);
  }
  for (let k = 0; k < n; k++) { const j = (k + 1) % n; quadI(m, r0[k], r0[j], r1[j], r1[k], col, cen); }
  for (let k = 1; k < n - 1; k++) { face(m, r0[0], r0[k], r0[k + 1], cap || col, cen); face(m, r1[0], r1[k], r1[k + 1], cap || col, cen); }
}
function finish(m) {
  let r = 0, zl = 1e9, zh = -1e9;
  for (const v of m.v) { r = Math.max(r, Math.hypot(v[0], v[1])); zl = Math.min(zl, v[2]); zh = Math.max(zh, v[2]); }
  m.cz = (zl + zh) / 2; m.r = Math.hypot(r, (zh - zl) / 2) + 0.5;

}
function charredMesh(src, seed) {
  const m = { v: src.v, f: src.f.map((f, i) => {
    const h = hash(i, 3, seed), rust = h < 0.18;
    const col = rust ? C(h < 0.08 ? K.rud : K.ru) : f.col.map((c, k) => Math.round(c * 0.26 + [28, 22, 18][k] * 0.74 * (0.7 + hash(i, k, seed) * 0.5)));
    return Object.assign({}, f, { col });
  }) };
  return finish(m);
}

// soldiers: pose is 'ride', 'run0', 'run1' or 'stand'
function soldier(m, ox, oz, pose, civ) {
  const uni = civ ? '#5b5248' : K.ol, unid = civ ? '#433b33' : K.old, helm = civ ? '#2f2b28' : K.hel;

    box(m, ox - 1, ox + 3, -2.6, -1.4, oz - 1, oz + 0.6, unid); box(m, ox - 1, ox + 3, 1.4, 2.6, oz - 1, oz + 0.6, unid);
    box(m, ox + 2.2, ox + 3.4, -2.6, -1.4, oz - 4.5, oz - 0.6, unid); box(m, ox + 2.2, ox + 3.4, 1.4, 2.6, oz - 4.5, oz - 0.6, unid);
    box(m, ox - 1.6, ox + 1.4, -1.9, 1.9, oz, oz + 5.2, uni, K.oll);
    box(m, ox + 0.6, ox + 5, -2.8, -1.9, oz + 3.4, oz + 4.4, uni); box(m, ox + 0.6, ox + 5, 1.9, 2.8, oz + 3.4, oz + 4.4, uni);
    box(m, ox - 1.2, ox + 1.4, -1.4, 1.4, oz + 5.2, oz + 8, helm, K.oll);
    box(m, ox + 1.4, ox + 1.6, -0.8, 0.8, oz + 5.4, oz + 6.6, K.sk);

  box(m, -0.7 - s * 1.1, 0.7 - s * 1.1, 0.2, 1.4, 0, 5, unid, uni);
  box(m, -0.8 + s * 1.1, 1 + s * 1.1, -1.4, -0.2, 0, 0.8, K.boot); box(m, -0.8 - s * 1.1, 1 - s * 1.1, 0.2, 1.4, 0, 0.8, K.boot);

  box(m, -2.4, -1.2, -1.4, 1.4, 5.8, 9.4, unid);
  box(m, 0.4, 4.6, 1.9, 2.5, 7.2, 8, K.o);
  box(m, -1.3, 1.3, -1.3, 1.3, 10, 12.8, helm, K.oll);

function bikeMesh(crew, civ) {
  const m = mesh();
  cyl(m, 'y', -6.5, 3.2, 3.2, -0.8, 0.8, 8, K.o, K.gd);
  cyl(m, 'y', 6.5, 3.2, 3.2, -0.8, 0.8, 8, K.o, K.gd);
  box(m, -3, 3, -1.2, 1.2, 2.4, 5.6, K.gd, K.gm);
  box(m, 0, 4.2, -1.6, 1.6, 5.4, 8, K.ru, K.rul);
  box(m, -5.5, 0, -1.4, 1.4, 6, 7.2, K.o);
  box(m, -9, -5, -1, 1, 6.2, 7, K.rud);
  box(m, 5.2, 6.2, -0.6, 0.6, 3.2, 9.6, K.gm);
  box(m, 5, 6, -4, 4, 9.4, 10.2, K.o);

function vanMesh() {
  const m = mesh(), body = '#7b8848', top = '#98a65d', glass = '#1f2b35', dk = '#5d6935';
  for (const x of [-11, 11]) { cyl(m, 'y', x, 3.5, 3.5, -9.2, -6.6, 8, K.o, K.gd); cyl(m, 'y', x, 3.5, 3.5, 6.6, 9.2, 8, K.o, K.gd); }

  box(m, 15, 17.6, -8.3, 8.3, 3.2, 9.5, body, top);
  box(m, 15, 16.4, -8.1, 8.1, 9.5, 15.2, glass);
  box(m, 9, 14.4, -8.7, 8.7, 10.4, 14.4, glass);
  box(m, -9, 4, -8.7, 8.7, 11.2, 14.4, '#2b3a44');
  box(m, -17.3, -16, -6, 6, 9, 14.6, glass);
  box(m, -17, 17, -8.6, 8.6, 3.2, 5, dk);
  box(m, 17.4, 18.6, -8, 8, 3, 5, K.o);
  box(m, 17.4, 18, -7.2, -5, 6.2, 8.2, '#f3e7a0'); box(m, 17.4, 18, 5, 7.2, 6.2, 8.2, '#f3e7a0');
  box(m, -8, -3, -4, 2, 16, 16.4, '#4b5527'); box(m, 2, 7, 1, 6, 16, 16.4, '#4b5527'); box(m, -14, -10, -6, -2, 16, 16.4, '#4b5527');

const MESH = {

// ---------------------------------------------------------------- map
const THEMES = [
  { name: 'WHEAT BELT', fields: ['wheat', 'wheat', 'wheat', 'plow', 'grass'], belts: 0.45, ew: 0.25, poles2: false, puddle: 1 },
  { name: 'TREE LINE ROAD', fields: ['grass', 'wheat', 'plow', 'grass'], belts: 0.85, ew: 0.6, poles2: false, puddle: 1 },
  { name: 'POWER LINE FLATS', fields: ['plow', 'wheat', 'mud', 'plow'], belts: 0.25, ew: 0.15, poles2: true, puddle: 1.8 },
];
const PW = 230;
let M = null;
function roadY(x) { return LAT / 2 + 24 * Math.sin(x * 0.0037 + M.s1) + 8 * Math.sin(x * 0.0101 + M.s2); }
const parcel = x => Math.floor((x + 5000) / PW);

function newMap(n) {

const OBJ = {

  trash: { hw: 5, hh: 3, fx: 'trash', mesh: 'trash' },
  barrels: { hw: 5, hh: 2, solid: true, mesh: 'barrels' },

function genWorld() {
  const rng = M.rng, th = M.theme;
  // the gauntlet: the first few seconds on the road are packed with junk
  let x = 260;
  while (x < M.gauntEnd) {
    const ry = roadY(x);
    const k = pick(rng, [['tank', 3], ['bikewreck', 2.2], ['trash', 2], ['puddle', 2 * th.puddle], ['barrels', 1], ['vanwreck', 0.7]]);
    const o1 = (rng() * 2 - 1) * (RH - 5);
    const kk = k === 'tank' && rng() < 0.5 ? 'tankW' : k;
    const a = place(kk, x, ry + o1, { smoke: (k === 'tank' || k === 'vanwreck') && rng() < 0.4 });
    if (rng() < 0.3) {
      const side = o1 > 0 ? -1 : 1;
      const k2 = pick(rng, [['trash', 2], ['puddle', 2], ['bikewreck', 1.5], ['barrels', 1]]);
      const o2 = side * (6 + rng() * (RH - 10));
      if (Math.abs(o2 - o1) > a.hh + 18) place(k2, x + rnd(-8, 8), ry + o2);
    }
    if (rng() < 0.12) place(rng() < 0.5 ? 'tank' : 'bikewreck', x + rnd(-20, 20), ry + (rng() < 0.5 ? -1 : 1) * (RH + 12 + rng() * 16), { smoke: rng() < 0.3 });
    x += 95 + rng() * 60 - Math.min(15, M.n * 4);
  }
  // the open stretch: a few craters and puddles, mostly room for the drones to work
  x = M.gauntEnd + 90;
  while (x < M.front - 90) {
    const ry = roadY(x);
    const k = pick(rng, [['puddle', 2 * th.puddle], ['crater', 3], ['trash', 1], ['tank', 0.8]]);
    const off = k === 'tank' ? (rng() < 0.5 ? -1 : 1) * (RH + 10) : (rng() * 2 - 1) * (RH - 4);
    place(k, x, ry + off, { smoke: k === 'tank' && rng() < 0.5 });
    x += 230 + rng() * 200;
  }
  for (let i = 0; i < 90; i++) {
    const hx = M.gauntEnd + rng() * (M.front - M.gauntEnd);
    M.decals.push({ type: 'hole', x: hx, y: 4 + rng() * (LAT - 8), r: 2 + rng() * 3 });
  }
  // power lines along the road
  for (let px = -320, i = 0; px < M.front + 420; px += 78, i++) {
    if (rng() < 0.07) continue;
    const pn = place('pole', px, roadY(px) - RH - 8);
    M.poles[0].push(pn);
    if (th.poles2) { const qx = px + 39; const ps = place('pole', qx, roadY(qx) + RH + 9); M.poles[1].push(ps); }
  }
  // tree lines along field borders (running on past the playable strip) and parallel to the road
  for (let pi = parcel(-420); pi <= parcel(M.front + 600); pi++) {
    const bx = pi * PW - 5000;
    if (hash(pi, 1, M.seed) < th.belts) {
      const ry = roadY(bx);
      for (let y = 4 + rng() * 4; y < ry - RH - 14; y += 7 + rng() * 3) place('tree', bx + rnd(-2, 2), y);
      for (let y = ry + RH + 16 + rng() * 3; y < LAT - 2; y += 7 + rng() * 3) place('tree', bx + rnd(-2, 2), y);
      for (let y = -4 - rng() * 4; y > Y0 + 12; y -= 8 + rng() * 4) place('tree', bx + rnd(-2, 2), y, { solid: false });
      for (let y = LAT + 4 + rng() * 4; y < Y0 + TW - 12; y += 8 + rng() * 4) place('tree', bx + rnd(-2, 2), y, { solid: false });
    }
    for (const side of [-1, 1]) {
      if (hash(pi, side + 5, M.seed) >= th.ew) continue;
      const off = RH + 28 + rng() * 10;
      for (let tx = bx + 8; tx < bx + PW - 8; tx += 7 + rng() * 3) {
        const ty = roadY(tx) + side * off;
        if (ty > 4 && ty < LAT - 2 && (tx < M.front - 20 || tx > M.front + 30)) place('tree', tx, ty);
      }
    }
  }
  // the frontline: a trench, sandbags and our flags
  M.decals.push({ type: 'trench', x: M.front, y: 90, r: 12 });
  const fry = roadY(M.front);
  for (let y = 4; y < LAT; y += 7) {
    if (Math.abs(y - fry) < RH + 2) continue;
    place('sandbag', M.front + 12 + ((y / 7) % 2) * 2, y);
  }
  place('flag', M.front + 14, fry - RH - 6);
  place('flag', M.front + 14, fry + RH + 10);
}

// ---------------------------------------------------------------- terrain chunks (textures for the ground pass)
const PAL = {
  road: ['#8a6842', '#80603c', '#927048'].map(C), rut: C('#684e30'), rutL: C('#735737'), roadEdge: C('#70563a'), pebL: C('#b0966e'), pebD: C('#543e28'),
  verge: ['#5c8034', '#50722e', '#688c3a'].map(C), track: C('#78603c'),
  wheat: ['#d6b04c', '#c8a040', '#b48a36'].map(C), wheatHi: C('#ecd070'), wheatLo: C('#957030'),
  plow: [C('#5c4028'), C('#765232'), C('#765232'), C('#684a2e')], sprout: C('#60783a'),
  grass: ['#60863a', '#567a32', '#6c943e'].map(C), flower: C('#e6dc78'), flowerW: C('#eae6dc'),
  mud: [C('#5a4630'), C('#503e2a')], mudW: C('#465f6c'),

function fieldType(pi, side) { const f = M.theme.fields; return f[(hash(pi, side, M.seed) * f.length) | 0]; }
function genChunk(ci) {

    const wx = ci * CW + CW - 1 - row, ry = roadY(wx);

    const pi = parcel(wx), border = (wx - (pi * PW - 5000)) < 3;

      const y = col + Y0, yy = y + 900;
      const dd = y - ry, ad = Math.abs(dd), n = hash(wx, y, s);
      const edge = RH + (dd < 0 ? ejN : ejS);

        cc = PAL.road[(n * 3) | 0];

      } else if (ad < edge + 4 + (hash(wx >> 2, 9, s) < 0.5 ? 1 : 0)) {

// ---------------------------------------------------------------- audio
let AC = null, master, engOsc, engGain, whOsc, whGain, noiseBuf, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
    engOsc = AC.createOscillator(); engOsc.type = 'sawtooth';
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    engGain = AC.createGain(); engGain.gain.value = 0;
    engOsc.connect(lp); lp.connect(engGain); engGain.connect(master); engOsc.start();
    whOsc = AC.createOscillator(); whOsc.type = 'square';
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 2;
    whGain = AC.createGain(); whGain.gain.value = 0;
    whOsc.connect(bp); bp.connect(whGain); whGain.connect(master); whOsc.start();
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

// ---------------------------------------------------------------- game state
const SPEC = {
  bike: { cruise: 76, boost: 98, brake: 36, lat: 92, ak: 3.6, lk: 12, hw: 7, hh: 3, off: 0.8, name: 'DIRT BIKE' },
  van: { cruise: 64, boost: 82, brake: 30, lat: 78, ak: 3, lk: 9, hw: 15, hh: 7, off: 0.7, name: 'BOHAKA VAN' },
  foot: { cruise: 40, boost: 50, brake: -18, lat: 46, ak: 6, lk: 10, hw: 2, hh: 2, off: 0.92, name: 'ON FOOT' },
};
let state = 'title', paused = false;
let W = null, run = null, units = [], drones = [], parts = [], ctl = null, nextUp = null;

try { camMode = localStorage.getItem('flr3d-cam') === '1' ? 1 : 3; } catch (e) { }

}

function startWave(n) {
  newMap(n);
  const total = 8 + Math.floor(Math.random() * 6);
  // score: every soldier's survival time in seconds, added up (and averaged) over the wave

}
function prepCard() {
  units = []; drones = []; ctl = null;
  const r = Math.random();
  let kind, crew;
  if (r < 0.42) { kind = 'bike'; crew = Math.random() < 0.4 ? 2 : 1; }
  else if (r < 0.86) { kind = 'van'; crew = 2 + Math.floor(Math.random() * 3); }
  else { kind = 'foot'; crew = 1; }
  crew = Math.min(crew, W.left);

  // other riders on the road: they are in the way, not on your side of the score
  const npcs = 1 + Math.min(3, M.n);
  for (let i = 0; i < npcs; i++) {
    const nx = 320 + Math.random() * (M.gauntEnd - 360), b = makeUnit('bike', nx, roadY(nx) + rnd(-RH + 5, RH - 5), 1);
    b.npc = true; b.vx = rnd(38, 54); b.cruise = b.vx; units.push(b);
  }
  camX = x - 50; camY = clamp(u.y - VW / 2, 0, LAT - VW); state = 'play';

function explosion(x, y, big) {
  const n = big ? 46 : 26;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = rnd(10, big ? 95 : 70);
    part(x, y, { z: 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.8, vz: rnd(10, 60), life: rnd(0.25, 0.7), size: (Math.random() * 3 + 1) | 0, col: ['#fff6c2', '#ffd34a', '#ff8a2a', '#d9441c'][(Math.random() * 4) | 0], drag: 3, grav: -40 });
  }
  for (let i = 0; i < (big ? 12 : 7); i++) part(x + rnd(-6, 6), y + rnd(-4, 4), { z: 3, vx: rnd(-10, 10), vz: rnd(12, 30), life: rnd(0.9, 1.8), size: (rnd(3, 6)) | 0, col: ['#4a4744', '#5e5a55', '#36332f'][(Math.random() * 3) | 0], drag: 1, smoke: true });
  for (let i = 0; i < 8; i++) part(x, y, { z: 1, vx: rnd(-60, 60), vy: rnd(-40, 40), vz: rnd(40, 90), life: rnd(0.5, 0.9), size: 1, col: '#1a1714', drag: 1, grav: 160 });

}

// ---------------------------------------------------------------- kills and damage

function panel(x, y, w, h) {

function droneArrows() {

function hud() {

  ctx.fillStyle = '#7a2a22'; ctx.fillRect(bx + Math.round(bw * M.gauntEnd / M.front), 4, 1, 4);

function card() {

  text('SOLDIER ' + Math.min(W.total, W.total - W.left + 1) + ' OF ' + W.total, SW / 2, 42, '#eeeadb', 'center');

// ---------------------------------------------------------------- input
const keys = new Set();
const KEYMAP = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
function action() {
  audioInit();

  else if (state === 'card') startRun();
  else if (state === 'play') { if (!paused) bail(); }
  else if (state === 'over' && overT > 0.8) startWave(W.n + 1);

function toggleCam() {

}
addEventListener('keydown', e => {

let last = performance.now();

newMap(1);
