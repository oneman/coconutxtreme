<body>
<canvas id="c" width="1536" height="864" tabindex="0" aria-label="CoconutXtreme: Frontline Rush Next, the voxel mud version. Steer anywhere with W A S D or the arrow keys, press Space to bail out of a vehicle, C to switch between third and first person. Race to the frontline and dodge the drones."></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- setup
// World coordinates are the same as the 2D game: x runs forward (toward the frontline),
// y runs across the road (0..LAT, increasing to the right), and z is height above the ground.
// Everything 3D is drawn by hand into a 384x216 pixel buffer (no WebGL): a voxel height field
// for the ground, then z-buffered flat-shaded triangles, billboards, lines and particles.
// This is the offshoot of flr3d.html where the ground is real: mud, ruts, bumps and craters
// that the bikes and vans ride over on sprung wheels.
const SW = 384, SH = 216, RES = 4, HUD = 12;
const LAT = 300, CW = 128, RH = 52;
// the 2D game's camera window, still used by the game logic (drone spawns, cleanup)
const VW = 192, VH = 231;
// the ground texture extends past the playable strip so the fields reach the horizon
const Y0 = -300, TW = 900;
// how far you can roam: off the road and across the fields on both sides, and a little way back
const YMIN = Y0 + 14, YMAX = Y0 + TW - 14, XMIN = -300;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const FONT = '"Press Start 2P", monospace';

function fit() {
  const s = Math.min(innerWidth / SW, innerHeight / SH);
  const k = s >= 3 ? Math.floor(s) : s;
  cvs.style.width = Math.floor(SW * k) + 'px';
  cvs.style.height = Math.floor(SH * k) + 'px';
}
addEventListener('resize', fit); fit();

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const C = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
const pack = (r, g, b) => 0xff000000 | (b << 16) | (g << 8) | r;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 6.2832; while (d < -Math.PI) d += 6.2832; return d; };

// ---------------------------------------------------------------- 2D pixel art (textures, drawn in code)
const K = {
  o: '#16181d', ol: '#5f6d30', old: '#414b20', oll: '#83923f', hel: '#505b28', sk: '#d39b62',
  ru: '#8f4c27', rud: '#5e301a', rul: '#bb6c3b', gm: '#6f747b', gd: '#45494f', gl: '#aab0b6',
  ch: '#2d2824', chd: '#1d1a17', chm: '#3d3630', wh: '#eeeadb', boot: '#2a2a20'
};
function spr(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw((x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); }, g);
  return c;
}
function rotL(src) { return spr(src.height, src.width, (p, g) => { g.translate(0, src.width); g.rotate(-Math.PI / 2); g.drawImage(src, 0, 0); }); }
function blobSpr(w, h, seed, fn) {
  return spr(w, h, p => {
    const cx = (w - 1) / 2, cy = (h - 1) / 2, rx = w / 2 - 1, ry = h / 2 - 1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const e = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + (hash(x, y, seed) - 0.5) * 0.3;
      const c = fn(e, x - cx, y - cy);
      if (c) p(x, y, 1, 1, c);
    }
  });
}
const puddleSpr = (w, h, s) => blobSpr(w, h, s, (e, dx, dy) =>
  e < 0.72 ? ((dy < -1 && dy > -3 && Math.abs(dx) < w / 4 && hash(dx, dy, s) < 0.6) ? '#9cc6dc' : '#43708c')
  : e < 0.95 ? '#2e4b5f' : e < 1.15 ? '#5c4630' : null);
const craterSpr = (w, h, s) => blobSpr(w, h, s, (e) =>
  e < 0.45 ? '#3a5a6a' : e < 0.8 ? '#45321f' : e < 1.05 ? '#8f7050' : e < 1.2 ? '#6e5236' : null);
// side-on trees for billboards: windbreak poplars and rounder field trees
function treeSide(w, h, seed, tall) {
  return spr(w, h, p => {
    const th = Math.round(h * (tall ? 0.18 : 0.28));
    p((w >> 1) - 1, h - th - 2, 2, th + 2, '#4a3320'); p((w >> 1) - 1, h - th - 2, 1, th + 2, '#5e432a');
    const ch = h - th, cx = (w - 1) / 2, cy = ch / 2, rx = w / 2, ry = ch / 2;
    for (let y = 0; y < ch; y++) for (let x = 0; x < w; x++) {
      const dx = x - cx, dy = y - cy, e = (dx / rx) ** 2 + (dy / ry) ** 2 + (hash(x, y, seed) - 0.5) * 0.4;
      if (e > 1) continue;
      let c = '#44692a';
      if (e > 0.8) c = '#2a4319';
      else if (dx / rx + dy / ry < -0.55) c = '#6f9a3c';
      else if (dx / rx + dy / ry > 0.5) c = '#2e4a1f';
      else if (hash(x >> 1, y >> 1, seed + 7) < 0.25) c = '#56803a';
      p(x, y, 1, 1, c);
    }
  });
}
function coconutSpr() {
  return spr(9, 9, p => {
    p(2, 0, 5, 9, '#6b3f1f'); p(0, 2, 9, 5, '#6b3f1f'); p(1, 1, 7, 7, '#6b3f1f');
    p(2, 1, 3, 1, '#9a6234'); p(1, 2, 1, 2, '#9a6234');
    p(3, 3, 1, 1, '#2a160a'); p(5, 3, 1, 1, '#2a160a'); p(4, 5, 1, 1, '#2a160a');
  });
}
function flagSpr() {
  const coco = coconutSpr();
  return spr(22, 28, (p, g) => {
    p(1, 0, 2, 28, '#5a3d22'); p(1, 0, 1, 28, '#7a5732');
    p(3, 1, 18, 12, '#2f7a3a'); p(3, 1, 18, 1, '#4ea25a'); p(3, 12, 18, 1, '#225a2a');
    g.drawImage(coco, 8, 3);
  });
}
function tex(c) { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height); return { w: c.width, h: c.height, d: new Uint32Array(d.data.buffer) }; }

const SPR = {
  coconut: coconutSpr(),
  puddles: [puddleSpr(24, 10, 3), puddleSpr(18, 8, 5), puddleSpr(30, 12, 9)].map(rotL),
  craters: [craterSpr(22, 12, 11), craterSpr(18, 10, 13)].map(rotL),
  bigCraters: [craterSpr(34, 22, 15), craterSpr(28, 18, 17), craterSpr(40, 26, 19)].map(rotL),
};
const TEX = {
  trees: [treeSide(10, 30, 21, true), treeSide(16, 24, 23), treeSide(12, 28, 25, true), treeSide(18, 26, 27), treeSide(14, 22, 29)].map(tex),
  flag: tex(flagSpr()),
};

// ---------------------------------------------------------------- 3D models (boxes and prisms, flat shaded)
function mesh() { return { v: [], f: [] }; }
function face(m, ia, ib, ic, col, cen, ds) {
  const a = m.v[ia], b = m.v[ib], c = m.v[ic];
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz); if (l < 1e-9) return;
  nx /= l; ny /= l; nz /= l;
  if (cen) {
    const dx = (a[0] + b[0] + c[0]) / 3 - cen[0], dy = (a[1] + b[1] + c[1]) / 3 - cen[1], dz = (a[2] + b[2] + c[2]) / 3 - cen[2];
    if (nx * dx + ny * dy + nz * dz < 0) { const t = ib; ib = ic; ic = t; nx = -nx; ny = -ny; nz = -nz; }
  }
  m.f.push({ a: ia, b: ib, c: ic, nx, ny, nz, col: typeof col === 'string' ? C(col) : col, ds: !!ds });
}
function quadI(m, i0, i1, i2, i3, col, cen, ds) { face(m, i0, i1, i2, col, cen, ds); face(m, i0, i2, i3, col, cen, ds); }
function box(m, x0, x1, y0, y1, z0, z1, col, top) {
  const cen = [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], i = m.v.length;
  m.v.push([x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]);
  quadI(m, i + 4, i + 5, i + 6, i + 7, top || col, cen);
  if (z0 > 0.01) quadI(m, i, i + 1, i + 2, i + 3, col, cen);
  quadI(m, i + 1, i + 2, i + 6, i + 5, col, cen);
  quadI(m, i, i + 3, i + 7, i + 4, col, cen);
  quadI(m, i + 3, i + 2, i + 6, i + 7, col, cen);
  quadI(m, i, i + 1, i + 5, i + 4, col, cen);
}
// a prism: axis 'y' for wheels, 'z' for barrels
function cyl(m, axis, a, b, r, l0, l1, n, col, cap) {
  const P = (u, v, l) => axis === 'y' ? [a + u, l, b + v] : [a + u, b + v, l];
  const cen = P(0, 0, (l0 + l1) / 2), r0 = [], r1 = [];
  for (let k = 0; k < n; k++) {
    const t = (k + 0.5) / n * 6.2832, u = Math.cos(t) * r, v = Math.sin(t) * r;
    r0.push(m.v.push(P(u, v, l0)) - 1); r1.push(m.v.push(P(u, v, l1)) - 1);
  }
  for (let k = 0; k < n; k++) { const j = (k + 1) % n; quadI(m, r0[k], r0[j], r1[j], r1[k], col, cen); }
  for (let k = 1; k < n - 1; k++) { face(m, r0[0], r0[k], r0[k + 1], cap || col, cen); face(m, r1[0], r1[k], r1[k + 1], cap || col, cen); }
}
function finish(m) {
  let r = 0, zl = 1e9, zh = -1e9;
  for (const v of m.v) { r = Math.max(r, Math.hypot(v[0], v[1])); zl = Math.min(zl, v[2]); zh = Math.max(zh, v[2]); }
  m.cz = (zl + zh) / 2; m.r = Math.hypot(r, (zh - zl) / 2) + 0.5;

}
function charredMesh(src, seed) {
  const m = { v: src.v, f: src.f.map((f, i) => {
    const h = hash(i, 3, seed), rust = h < 0.18;
    const col = rust ? C(h < 0.08 ? K.rud : K.ru) : f.col.map((c, k) => Math.round(c * 0.26 + [28, 22, 18][k] * 0.74 * (0.7 + hash(i, k, seed) * 0.5)));
    return Object.assign({}, f, { col });
  }) };
  return finish(m);
}

// soldiers: pose is 'ride', 'run0', 'run1' or 'stand'
function soldier(m, ox, oz, pose, civ) {
  const uni = civ ? '#5b5248' : K.ol, unid = civ ? '#433b33' : K.old, helm = civ ? '#2f2b28' : K.hel;

    box(m, ox + 2.2, ox + 3.4, -2.6, -1.4, oz - 4.5, oz - 0.6, unid); box(m, ox + 2.2, ox + 3.4, 1.4, 2.6, oz - 4.5, oz - 0.6, unid);
    box(m, ox - 1.6, ox + 1.4, -1.9, 1.9, oz, oz + 5.2, uni, K.oll);
    box(m, ox + 0.6, ox + 5, -2.8, -1.9, oz + 3.4, oz + 4.4, uni); box(m, ox + 0.6, ox + 5, 1.9, 2.8, oz + 3.4, oz + 4.4, uni);
    box(m, ox - 1.2, ox + 1.4, -1.4, 1.4, oz + 5.2, oz + 8, helm, K.oll);

  box(m, -0.7 - s * 1.1, 0.7 - s * 1.1, 0.2, 1.4, 0, 5, unid, uni);
  box(m, -0.8 + s * 1.1, 1 + s * 1.1, -1.4, -0.2, 0, 0.8, K.boot); box(m, -0.8 - s * 1.1, 1 - s * 1.1, 0.2, 1.4, 0, 0.8, K.boot);
  box(m, -1.2, 1.2, -1.9, 1.9, 5, 10, uni, K.oll);
  box(m, -2.4, -1.2, -1.4, 1.4, 5.8, 9.4, unid);
  box(m, 0.4, 4.6, 1.9, 2.5, 7.2, 8, K.o);
  box(m, -1.3, 1.3, -1.3, 1.3, 10, 12.8, helm, K.oll);

function bikeMesh(crew, civ) {
  const m = mesh();

  cyl(m, 'y', 6.5, 3.2, 3.2, -0.8, 0.8, 8, K.o, K.gd);
  box(m, -3, 3, -1.2, 1.2, 2.4, 5.6, K.gd, K.gm);
  box(m, 0, 4.2, -1.6, 1.6, 5.4, 8, K.ru, K.rul);
  box(m, -5.5, 0, -1.4, 1.4, 6, 7.2, K.o);
  box(m, -9, -5, -1, 1, 6.2, 7, K.rud);
  box(m, 5.2, 6.2, -0.6, 0.6, 3.2, 9.6, K.gm);

  box(m, -9, 4, -8.7, 8.7, 11.2, 14.4, '#2b3a44');
  box(m, -17.3, -16, -6, 6, 9, 14.6, glass);
  box(m, -17, 17, -8.6, 8.6, 3.2, 5, dk);

  box(m, 17.4, 18, -7.2, -5, 6.2, 8.2, '#f3e7a0'); box(m, 17.4, 18, 5, 7.2, 6.2, 8.2, '#f3e7a0');

const MESH = {

MESH.bikeWreck = charredMesh(MESH.bike[0], 31);

// ---------------------------------------------------------------- map
const THEMES = [
  { name: 'MUD SEASON', fields: ['stubble', 'stubble', 'plow', 'mud', 'grass'], belts: 0.45, ew: 0.25, poles2: false, puddle: 1.3 },

const PW = 230;
let M = null;
function roadY(x) { return LAT / 2 + 24 * Math.sin(x * 0.0037 + M.s1) + 8 * Math.sin(x * 0.0101 + M.s2); }
const parcel = x => Math.floor((x + 5000) / PW);

const OBJ = {

  tankW: { hw: 13, hh: 6, solid: true, mesh: 'tank', flip: true },
  bikewreck: { hw: 7, hh: 3, solid: true, mesh: 'bikeWreck' },
  vanwreck: { hw: 15, hh: 7, solid: true, mesh: 'vanWreck' },
  trash: { hw: 5, hh: 3, fx: 'trash', mesh: 'trash' },
  barrels: { hw: 5, hh: 2, solid: true, mesh: 'barrels' },
  pole: { hw: 1, hh: 1, solid: true, mesh: 'pole' },
  tree: { hw: 2, hh: 2, solid: true },
  puddle: { fx: 'puddle', flat: true },
  crater: { fx: 'puddle', flat: true },
  bigcrater: { fx: 'puddle', flat: true },
  hay: { hw: 3.4, hh: 3.6, solid: true, mesh: 'hay' },
  sandbag: { deco: true, mesh: 'sandbag' },

function genWorld() {
  const rng = M.rng, th = M.theme;
  // the gauntlet: the first few seconds on the road are packed with junk
  let x = 260;
  while (x < M.gauntEnd) {
    const ry = roadY(x);
    const k = pick(rng, [['tank', 3], ['bikewreck', 2.2], ['trash', 2], ['puddle', 2 * th.puddle], ['barrels', 1], ['vanwreck', 0.7]]);
    const o1 = (rng() * 2 - 1) * (RH - 5);
    const kk = k === 'tank' && rng() < 0.5 ? 'tankW' : k;
    const a = place(kk, x, ry + o1, { smoke: (k === 'tank' || k === 'vanwreck') && rng() < 0.4 });
    if (rng() < 0.3) {
      const side = o1 > 0 ? -1 : 1;
      const k2 = pick(rng, [['trash', 2], ['puddle', 2], ['bikewreck', 1.5], ['barrels', 1]]);
      const o2 = side * (6 + rng() * (RH - 10));
      if (Math.abs(o2 - o1) > a.hh + 18) place(k2, x + rnd(-8, 8), ry + o2);
    }
    if (rng() < 0.12) place(rng() < 0.5 ? 'tank' : 'bikewreck', x + rnd(-20, 20), ry + (rng() < 0.5 ? -1 : 1) * (RH + 12 + rng() * 16), { smoke: rng() < 0.3 });
    x += 95 + rng() * 60 - Math.min(15, M.n * 4);
  }
  // the open stretch: a few craters and puddles, mostly room for the drones to work
  x = M.gauntEnd + 90;
  while (x < M.front - 90) {
    const ry = roadY(x);
    const k = pick(rng, [['puddle', 2 * th.puddle], ['crater', 3], ['trash', 1], ['tank', 0.8]]);
    const off = k === 'tank' ? (rng() < 0.5 ? -1 : 1) * (RH + 10) : (rng() * 2 - 1) * (RH - 4);
    place(k, x, ry + off, { smoke: k === 'tank' && rng() < 0.5 });
    x += 230 + rng() * 200;
  }
  for (let i = 0; i < 90; i++) {
    const hx = M.gauntEnd + rng() * (M.front - M.gauntEnd);
    M.decals.push({ type: 'hole', x: hx, y: 4 + rng() * (LAT - 8), r: 2 + rng() * 3 });
  }
  for (let i = 0; i < 220; i++) M.decals.push({ type: 'hole', x: -250 + rng() * (M.front + 200), y: YMIN + rng() * (YMAX - YMIN), r: 2 + rng() * 3 });
  // off the road: tree clumps, shell craters, hay bales and the odd wreck to run around
  for (const side of [-1, 1]) {
    for (let x = -260 + rng() * 40; x < M.front - 40; x += 34 + rng() * 46) {
      const y = roadY(x) + side * (RH + 16 + rng() * 300);
      if (y < YMIN + 10 || y > YMAX - 10) continue;
      const k = pick(rng, [['copse', 3.2], ['crater', 2], ['bigcrater', 2.4], ['hay', 1.6], ['tank', 0.5], ['bikewreck', 0.5], ['vanwreck', 0.4], ['barrels', 0.4]]);
      if (k === 'copse') {
        const n = 4 + ((rng() * 7) | 0);
        for (let i = 0; i < n; i++) { const a = rng() * 6.283, r = Math.sqrt(rng()) * (6 + n * 1.6), tx = x + Math.cos(a) * r, ty = y + Math.sin(a) * r; if (Math.abs(ty - roadY(tx)) > RH + 6) place('tree', tx, ty); }
      } else if (k === 'hay') {
        const n = 1 + ((rng() * 3) | 0);
        for (let i = 0; i < n; i++) place('hay', x + i * 9 + rnd(-1, 1), y + rnd(-6, 6));
      } else place(k === 'tank' && rng() < 0.5 ? 'tankW' : k, x, y, { smoke: (k === 'tank' || k === 'vanwreck') && rng() < 0.3 });
    }
  }
  // power lines along the road
  for (let px = -320, i = 0; px < M.front + 420; px += 78, i++) {
    if (rng() < 0.07) continue;
    const pn = place('pole', px, roadY(px) - RH - 8);
    M.poles[0].push(pn);
    if (th.poles2) { const qx = px + 39; const ps = place('pole', qx, roadY(qx) + RH + 9); M.poles[1].push(ps); }
  }

  const gappy = (a, b, fn) => {
    let t = a + rng() * 6, gap = a + 10 + rng() * 50;
    while (t < b) {
      if (t >= gap) { t += 28 + rng() * 10; gap = t + 30 + rng() * 80; continue; }
      fn(t); t += 7 + rng() * 3;

  };
  for (let pi = parcel(-420); pi <= parcel(M.front + 600); pi++) {
    const bx = pi * PW - 5000;
    if (hash(pi, 1, M.seed) < th.belts) {
      const ry = roadY(bx);
      gappy(Y0 + 10, ry - RH - 14, y => place('tree', bx + rnd(-2, 2), y));
      gappy(ry + RH + 16, Y0 + TW - 10, y => place('tree', bx + rnd(-2, 2), y));
    }
    for (const side of [-1, 1]) {
      if (hash(pi, side + 5, M.seed) >= th.ew) continue;
      const off = RH + 28 + rng() * 10;
      gappy(bx + 8, bx + PW - 8, tx => { if (tx < M.front - 20 || tx > M.front + 30) place('tree', tx, roadY(tx) + side * off); });
    }
  }

  for (let y = Y0 + 4; y < Y0 + TW; y += 7) {
    if (Math.abs(y - fry) < RH + 2) continue;
    place('sandbag', M.front + 12 + (Math.round((y - Y0) / 7) % 2) * 2, y);
  }

}

// ---------------------------------------------------------------- input
const keys = new Set();
